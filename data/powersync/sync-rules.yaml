# PowerSync account projection contract.
#
# The backend signs only the authenticated user ID as JWT `sub`. Account IDs
# are derived from the replicated accounts table, never from client parameters
# or a caller-controlled claim. Every selected view below contains that same
# account_id and no provider, credential, callback, payload, or raw ledger
# secrets.
bucket_definitions:
  account:
    parameters: |
      SELECT id AS account_id FROM accounts
      WHERE owner_user_id = request.user_id() AND status = 'active'
    data:
      - SELECT * FROM powersync_account_balances WHERE account_id = bucket.account_id
      - SELECT * FROM powersync_gateway_usage WHERE account_id = bucket.account_id
      - SELECT * FROM powersync_credit_transfers WHERE account_id = bucket.account_id
      - SELECT * FROM powersync_payments WHERE account_id = bucket.account_id
      - SELECT * FROM powersync_merchant_orders WHERE account_id = bucket.account_id
