config:
  edition: 3

streams:
  regional_catalog:
    auto_subscribe: true
    queries:
      - SELECT * FROM client_sync.models AS models WHERE status = 'active'
      - SELECT * FROM client_sync.providers AS providers WHERE status = 'active'
      - SELECT * FROM gizway.model_customer_prices

  current_user:
    auto_subscribe: true
    queries:
      - |
        SELECT id, provider_id, key, merchant_id, status, prices_json,
               created_at, updated_at
        FROM client_sync.provider_keys AS my_provider_keys
        WHERE owner_identity_subject = auth.user_id()
          AND owner_identity_issuer = auth.parameter('iss')
      - |
        SELECT id, external_order_id, account_id, subscription_id, product_id,
               model_id, provider_id, gross_microcredits, status, created_at,
               completed_at
        FROM gizway.ai_orders AS my_ai_orders
        WHERE owner_identity_subject = auth.user_id()
          AND owner_identity_issuer = auth.parameter('iss')
      - |
        SELECT id, account_id, order_id, model_id, metric, quantity,
               status, created_at
        FROM client_sync.ai_usage AS my_ai_usage
        WHERE owner_identity_subject = auth.user_id()
          AND owner_identity_issuer = auth.parameter('iss')
