# Runner-owned values. Captures produced inside a Hurl story do not belong here.
# Every story starts from its own fresh database fixture.
variables:
  pay_url: GizPay base URL
  way_url: GizWay base URL for the story region
  fake_url: embedded Bifrost fake Provider base URL
  credit_spy_url: transparent GizPay Credit Check and Charge counting proxy
  oauth_spy_url: transparent ZITADEL token endpoint counting proxy
  way_incomplete_url: GizWay instance with an intentionally incomplete optional dependency configuration

  human_token: main Merchant owner OIDC token
  human_token_same_subject_changed_email: same issuer and subject as human_token with changed profile claims
  human_token_two: payer OIDC token
  service_token: active Gateway Service Account token
  service_token_charger: active Gateway Service Account token allowed to submit Charge
  service_token_rotated: replacement Service Account for duplicate-order retry coverage
  service_token_other_user: Service Account owned by another User
  service_token_reader_only: Service Account without the Gateway Role
  revoked_service_token: revoked Service Account token
  expired_service_token: expired Service Account token
  wrong_signature_service_token: Service Account token signed by an untrusted key
  wrong_audience_service_token: Service Account token with wrong audience
  wrong_issuer_service_token: Service Account token with wrong issuer
  admin_token: Administrator for the story region
  other_region_admin_token: valid Administrator for another region
  wrong_project_admin_token: same-audience token with Administrator Role only in another ZITADEL Project
  wrong_issuer_admin_token: Administrator token with wrong issuer
  wrong_audience_admin_token: Administrator token with wrong audience
  revoked_admin_token: token for a revoked Administrator

  active_subscription_hmac: active Subscription Key HMAC with positive balance
  revoked_subscription_hmac: revoked Subscription Key HMAC
  zero_balance_subscription_hmac: active Subscription Key HMAC with zero balance
  negative_balance_subscription_hmac: active Subscription Key HMAC with negative balance
  paused_subscription_hmac: Key HMAC for a paused Subscription
  inactive_subscription_hmac: Key HMAC for an inactive Subscription
  inactive_product_subscription_hmac: Key HMAC for an inactive Product
  inactive_main_merchant_subscription_hmac: Key HMAC for a Product whose main Merchant is inactive
  raw_subscription_key: active customer API Key
  raw_subscription_key_other_product: active Key for another Product
  raw_subscription_key_quota_10: active Key whose Account starts with 10 microcredits
  raw_subscription_key_quota_100: active Key whose Account starts with 100 microcredits
  raw_subscription_key_quota_concurrent_20: active Key whose Account starts with 20 microcredits

  payer_account_id: payer Account linked to the pre-seeded PAYG Subscription
  main_merchant_account_id: main Merchant settlement Account
  provider_merchant_id: first active Provider beneficiary Merchant
  provider_merchant_id_two: second active Provider beneficiary Merchant
  inactive_provider_merchant_id: inactive Provider beneficiary Merchant
  provider_settlement_account_id: first Provider Merchant settlement Account
  provider_settlement_account_id_two: second Provider Merchant settlement Account
  provider_merchant_human_token: owner token for the first Provider Merchant Account
  provider_merchant_human_token_two: owner token for the second Provider Merchant Account
  platform_fee_account_id: fixed platform fee Account

  provider_key_secret: first raw Provider credential
  provider_key_secret_replacement: replacement for the first raw Provider credential
  provider_key_secret_two: second raw Provider credential
  provider_key_secret_three: alternate Provider credential
  seeded_model_id: seeded model used by protocol and rating stories
  seeded_bifrost_key_id: seeded Bifrost Key mapped to billing
