version: 1
server:
  name: cn.e2e.gizway.test
  listen_address: 0.0.0.0:8080
database:
  dsn: postgres://postgres:postgres@postgres-cn:5432/gizway?sslmode=disable
  schema: gizway
authentication:
  zitadel:
    issuer: http://zitadel:8080
    jwks_url: http://oauth-spy:19500/oauth/v2/keys
    admin_audience: "386000000000000003"
  service_account:
    token_url: http://oauth-spy:19500/oauth/v2/token
    subject: gizway-cn-service
    private_key_file: /fixtures/gizway-cn-service.json
    audience: "386000000000000002"
    requested_scopes: [openid]
    required_roles: [subscription_credit_reader, subscription_charger]
subscription_api_keys:
  hmac:
    secret_file: /secrets/subscription-api-key-hmac
gizpay:
  service_dsn: http://toxiproxy:8666
bifrost:
  config_store:
    type: postgresql
    dsn: postgres://postgres:postgres@postgres-cn:5432/gizway?sslmode=disable
    schema: bifrost_config
  log_store:
    type: postgresql
    dsn: postgres://postgres:postgres@postgres-cn:5432/gizway?sslmode=disable
    schema: bifrost_logs
