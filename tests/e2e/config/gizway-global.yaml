version: 1
server:
  name: global.e2e.gizclaw.test
  listen_address: 0.0.0.0:8080
admin:
  initial_key_file: /fixtures/admin-key
database:
  dsn: postgres://gizway_global_app:gizway_global_app@postgres-global:5432/gizway?sslmode=disable
  schema: gizway
authentication:
  zitadel:
    issuer: https://identity.e2e.gizclaw.test:18080
    jwks_url: http://oauth-spy:19500/oauth/v2/keys
    human_audience: "386000000000000001"
  service_account:
    token_url: http://oauth-spy:19500/oauth/v2/token
    private_key_file: /fixtures/gizway-global-service.json
    audience: "386000000000000002"
    requested_scopes: [openid]
    required_roles: [credit_check, charge]
subscription_keys:
  hmac:
    secret_file: /secrets/subscription-key-hmac
gizpay:
  service_dsn: http://toxiproxy:8666
credit_cache:
  cleanup_interval: 1m
bifrost:
  config_store:
    type: postgresql
    dsn: postgres://gizway_global_app:gizway_global_app@postgres-global:5432/gizway?sslmode=disable
    schema: bifrost_config
  log_store:
    type: postgresql
    dsn: postgres://gizway_global_app:gizway_global_app@postgres-global:5432/gizway?sslmode=disable
    schema: bifrost_logs
