version: 1
server:
  name: credit.e2e.gizway.test
  listen_address: 0.0.0.0:8081
database:
  dsn: postgres://postgres:postgres@postgres-gizpay:5432/gizpay?sslmode=disable
  schema: public
authentication:
  zitadel:
    issuer: http://zitadel:8080
    jwks_url: http://oauth-spy:19500/oauth/v2/keys
    human_audience: "386000000000000001"
    service_audience: "386000000000000002"
    management_client:
      token_url: http://oauth-spy:19500/oauth/v2/token
      private_key_file: /fixtures/zitadel-bootstrap-machine.json
subscription_api_keys:
  hmac:
    secret_file: /secrets/subscription-api-key-hmac
  encryption:
    active_version: 1
    keys:
      - version: 1
        secret_file: /secrets/subscription-api-key-encryption-v1
credit_check:
  recheck_interval: 5m1s
payg_charges:
  platform_fee_bps: 200
tls:
  enabled: false
