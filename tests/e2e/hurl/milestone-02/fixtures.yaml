# Values injected by the isolated Compose stack for every E2E case.
variables:
  pay_url: GizPay base URL
  cn_url: CN GizWay base URL
  global_url: Global GizWay base URL
  way_url: single-region GizWay base URL for the empty-database API closure
  incomplete_url: deliberately unbootstrapped GizWay base URL
  fake_url: Global fake Provider base URL
  credit_spy_url: transparent GizPay observer base URL
  oauth_spy_url: transparent ZITADEL token observer base URL
  toxiproxy_url: response-loss control API
  raw_subscription_key: shared customer API Key
  payer_account_id: shared central payer Account
  provider_merchant_id: Provider beneficiary Merchant created by the empty-database bootstrap
  human_token: payer Human OIDC token
  human_token_two: second payer Human OIDC token
  cn_admin_token: CN Administrator OIDC token
  global_admin_token: Global Administrator OIDC token
