name: gizway-milestone-02-e2e

x-postgres: &postgres
  image: postgres:17.10-bookworm
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
    interval: 1s
    timeout: 3s
    retries: 60

x-app: &app
  build:
    context: ../..
    dockerfile: tests/e2e/Dockerfile

x-hurl: &hurl
  image: ghcr.io/orange-opensource/hurl:7.0.0
  profiles: [hurl]
  volumes:
    - ./hurl:/tests:ro
    - fixtures:/fixtures:ro

services:
  postgres-zitadel:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    volumes: [postgres-zitadel:/var/lib/postgresql/data]

  postgres-gizpay:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gizpay
    volumes: [postgres-gizpay:/var/lib/postgresql/data]

  postgres-cn:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gizway
    volumes: [postgres-cn:/var/lib/postgresql/data]

  postgres-global:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gizway
    volumes: [postgres-global:/var/lib/postgresql/data]

  zitadel-fixtures-init:
    image: busybox:1.37.0
    user: "0:0"
    volumes: [fixtures:/fixtures]
    command: [sh, -ec, "chown 1000:1000 /fixtures && chmod 700 /fixtures"]

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    restart: on-failure:5
    depends_on:
      postgres-zitadel: {condition: service_healthy}
      zitadel-fixtures-init: {condition: service_completed_successfully}
    command:
      - start-from-init
      - --config
      - /config/zitadel.config.yaml
      - --config
      - /config/zitadel.secrets.yaml
      - --steps
      - /config/zitadel.init-steps.yaml
      - --masterkey
      - Milestone02MasterKeyMustBe32Byte
      - --tlsMode
      - disabled
    volumes:
      - ./zitadel:/config:ro
      - fixtures:/fixtures
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for attempt in $$(seq 1 60); do
            /app/zitadel ready --config /config/zitadel.config.yaml --config /config/zitadel.secrets.yaml && exit 0;
            sleep 1;
          done;
          exit 1
      interval: 2s
      timeout: 75s
      retries: 3

  zitadel-bootstrap:
    <<: *app
    depends_on:
      zitadel: {condition: service_started}
    volumes: [fixtures:/fixtures]
    command:
      - e2e-bootstrap
      - --mode=zitadel
      - --zitadel-url=http://zitadel:8080
      - --output-directory=/fixtures

  fake-provider-cn:
    <<: *app
    command:
      - fake-ai-provider
      - --address=0.0.0.0:19000
      - --credential=cn-provider-secret,cn-provider-secret-replacement,cn-provider-secret-two,cn-provider-secret-three
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:19000/test/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  fake-provider-global:
    <<: *app
    command: [fake-ai-provider, --address=0.0.0.0:19000, --credential=global-provider-secret]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:19000/test/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  gizpay:
    <<: *app
    depends_on:
      postgres-gizpay: {condition: service_healthy}
      zitadel-bootstrap: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
    volumes:
      - ./config/gizpay.yaml:/config/gizpay.yaml:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizpay, --config=/config/gizpay.yaml, --initialize]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8081/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  credit-spy:
    <<: *app
    depends_on:
      gizpay: {condition: service_healthy}
    command: [fake-credit-spy, --address=0.0.0.0:19400, --upstream=http://gizpay:8081]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0

  toxiproxy-init:
    image: curlimages/curl:8.15.0
    depends_on:
      credit-spy: {condition: service_started}
      toxiproxy: {condition: service_started}
    command:
      - sh
      - -ec
      - >-
        curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies
        -H 'Content-Type: application/json'
        -d '{"name":"gizpay","listen":"0.0.0.0:8666","upstream":"credit-spy:19400"}'

  oauth-spy:
    <<: *app
    depends_on:
      zitadel: {condition: service_started}
    command: [fake-oauth-spy, --address=0.0.0.0:19500, --upstream=http://zitadel:8080]

  gizway-cn:
    <<: *app
    depends_on:
      postgres-cn: {condition: service_healthy}
      fake-provider-cn: {condition: service_healthy}
      toxiproxy-init: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
      zitadel-bootstrap: {condition: service_completed_successfully}
    volumes:
      - ./config/gizway-cn.yaml:/config/gizway.yaml:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizway, --config=/config/gizway.yaml, --initialize]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8080/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  gizway-global:
    <<: *app
    depends_on:
      postgres-global: {condition: service_healthy}
      fake-provider-global: {condition: service_healthy}
      toxiproxy-init: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
      zitadel-bootstrap: {condition: service_completed_successfully}
    volumes:
      - ./config/gizway-global.yaml:/config/gizway.yaml:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizway, --config=/config/gizway.yaml, --initialize]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8080/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  # This instance deliberately receives no Model, Provider Key, or price seed.
  gizway-incomplete:
    <<: *app
    depends_on:
      gizway-global: {condition: service_healthy}
    volumes:
      - ./config/gizway-incomplete.yaml:/config/gizway.yaml:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizway, --config=/config/gizway.yaml, --initialize]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8082/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  bootstrap-empty-api:
    <<: *app
    profiles: [empty-api]
    depends_on:
      gizpay: {condition: service_healthy}
    volumes:
      - fixtures:/fixtures
    command:
      - e2e-bootstrap
      - --mode=milestone-02-empty-api
      - --gizpay-url=http://gizpay:8081
      - --cn-url=http://gizway-empty:8083
      - --fixture-file=/fixtures/empty-api.vars
      - --identity-file=/fixtures/identity.vars
      - --output-directory=/fixtures
      - --gizpay-dsn=postgres://postgres:postgres@postgres-gizpay:5432/gizpay?sslmode=disable
      - --cn-dsn=postgres://postgres:postgres@postgres-cn:5432/gizway?sslmode=disable
      - --cn-provider-url=http://fake-provider-cn:19000

  gizway-empty:
    <<: *app
    profiles: [empty-api]
    depends_on:
      postgres-cn: {condition: service_healthy}
      fake-provider-cn: {condition: service_healthy}
      toxiproxy-init: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
      bootstrap-empty-api: {condition: service_completed_successfully}
    volumes:
      - ./config/gizway-empty.yaml:/config/gizway.yaml:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizway, --config=/config/gizway.yaml, --initialize]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8083/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  bootstrap-milestone-02:
    <<: *app
    depends_on:
      gizpay: {condition: service_healthy}
      gizway-cn: {condition: service_healthy}
      gizway-global: {condition: service_healthy}
      gizway-incomplete: {condition: service_healthy}
    volumes:
      - fixtures:/fixtures
      - ./secrets:/secrets:ro
    command:
      - e2e-bootstrap
      - --mode=milestone-02
      - --zitadel-url=http://zitadel:8080
      - --gizpay-url=http://gizpay:8081
      - --cn-url=http://gizway-cn:8080
      - --global-url=http://gizway-global:8080
      - --fixture-file=/fixtures/e2e.vars
      - --identity-file=/fixtures/identity.vars
      - --story=${MILESTONE02_STORY:-e2e}
      - --gizpay-dsn=postgres://postgres:postgres@postgres-gizpay:5432/gizpay?sslmode=disable
      - --cn-dsn=postgres://postgres:postgres@postgres-cn:5432/gizway?sslmode=disable&search_path=gizway
      - --global-dsn=postgres://postgres:postgres@postgres-global:5432/gizway?sslmode=disable&search_path=gizway
      - --hmac-secret-file=/secrets/subscription-api-key-hmac
      - --cn-provider-url=http://fake-provider-cn:19000
      - --global-provider-url=http://fake-provider-global:19000

  hurl-regional-isolation:
    <<: *hurl
    command: [--test, --variables-file=/fixtures/e2e.vars, /tests/milestone-02/01-shared-key-regional-isolation.hurl]

  hurl-restart-credit-warmup:
    <<: *hurl
    command: [--test, --variables-file=/fixtures/e2e.vars, /tests/milestone-02/02-restart-credit-warmup.hurl]

  hurl-restart-rechecks-credit:
    <<: *hurl
    command: [--test, --variables-file=/fixtures/e2e.vars, /tests/milestone-02/02-restart-rechecks-credit.hurl]

  hurl-outbox-response-loss:
    <<: *hurl
    command: [--test, --variables-file=/fixtures/e2e.vars, /tests/milestone-02/03-outbox-response-loss-recovery.hurl]

  hurl-health-no-remote-fanout:
    <<: *hurl
    command: [--test, --variables-file=/fixtures/e2e.vars, /tests/milestone-02/04-health-no-remote-fanout.hurl]

  hurl-health-database-down:
    <<: *hurl
    command: [--test, --variables-file=/fixtures/e2e.vars, /tests/milestone-02/05-health-database-down.hurl]

  hurl-empty-api-closure:
    <<: *hurl
    profiles: [empty-api]
    command: [--test, --variables-file=/fixtures/empty-api.vars, /tests/milestone-02/06-empty-database-api-closure.hurl]

  hurl-api:
    image: ghcr.io/orange-opensource/hurl:7.0.0
    profiles: [milestone-02-api]
    volumes:
      - ../..:/workspace:ro
      - fixtures:/fixtures:ro
    command: [--version]

volumes:
  fixtures:
  postgres-zitadel:
  postgres-gizpay:
  postgres-cn:
  postgres-global:
