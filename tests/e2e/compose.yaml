name: gizway-milestone-03-e2e

x-postgres: &postgres
  image: postgres:17.10-bookworm
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  healthcheck:
    # pg_isready also succeeds against the temporary server used by the
    # official image while /docker-entrypoint-initdb.d is still running. PID 1
    # becomes postgres only after that initialization server has shut down and
    # the final server has started.
    test: [CMD-SHELL, 'test "$$(cat /proc/1/comm)" = postgres && pg_isready -U postgres -d "$${POSTGRES_DB}"']
    interval: 1s
    timeout: 3s
    retries: 60
  command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]

x-app: &app
  build:
    context: ../..
    dockerfile: tests/e2e/Dockerfile

services:
  postgres-zitadel:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    volumes: [postgres-zitadel:/var/lib/postgresql/data]

  postgres-gizpay:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gizpay
    volumes:
      - postgres-gizpay:/var/lib/postgresql/data
      - ./postgres/init-source.sql:/docker-entrypoint-initdb.d/init-source.sql:ro
    ports: ["127.0.0.1::5432"]

  postgres-cn:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gizway
    volumes:
      - postgres-cn:/var/lib/postgresql/data
      - ./postgres/init-source.sql:/docker-entrypoint-initdb.d/init-source.sql:ro

  postgres-global:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gizway
    volumes:
      - postgres-global:/var/lib/postgresql/data
      - ./postgres/init-source.sql:/docker-entrypoint-initdb.d/init-source.sql:ro
    ports: ["127.0.0.1::5432"]

  postgres-powersync:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-powersync:/var/lib/postgresql/data
      - ./postgres/init-powersync.sql:/docker-entrypoint-initdb.d/init-powersync.sql:ro

  powersync-gizpay:
    image: journeyapps/powersync-service:1.23.3
    profiles: [powersync]
    depends_on:
      postgres-gizpay: {condition: service_healthy}
      postgres-powersync: {condition: service_healthy}
      oauth-spy: {condition: service_started}
      gizpay: {condition: service_healthy}
    environment: [POWERSYNC_CONFIG_PATH=/config/service.yaml]
    volumes:
      - ../powersync/config/gizpay-service.yaml:/config/service.yaml:ro
      - ../powersync/config/gizpay-sync-config.yaml:/config/sync-config.yaml:ro
    ports: ["127.0.0.1::8080"]

  powersync-cn:
    image: journeyapps/powersync-service:1.23.3
    profiles: [powersync]
    depends_on:
      postgres-cn: {condition: service_healthy}
      postgres-powersync: {condition: service_healthy}
      oauth-spy: {condition: service_started}
      gizway-cn: {condition: service_healthy}
    environment: [POWERSYNC_CONFIG_PATH=/config/service.yaml]
    volumes:
      - ../powersync/config/gizway-cn-service.yaml:/config/service.yaml:ro
      - ../powersync/config/gizway-cn-sync-config.yaml:/config/sync-config.yaml:ro
    ports: ["127.0.0.1::8080"]

  powersync-global:
    image: journeyapps/powersync-service:1.23.3
    profiles: [powersync]
    depends_on:
      postgres-global: {condition: service_healthy}
      postgres-powersync: {condition: service_healthy}
      oauth-spy: {condition: service_started}
      gizway-global: {condition: service_healthy}
    environment: [POWERSYNC_CONFIG_PATH=/config/service.yaml]
    volumes:
      - ../powersync/config/gizway-global-service.yaml:/config/service.yaml:ro
      - ../powersync/config/gizway-global-sync-config.yaml:/config/sync-config.yaml:ro
    ports: ["127.0.0.1::8080"]

  zitadel-fixtures-init:
    image: busybox:1.37.0
    user: "0:0"
    volumes: [fixtures:/fixtures]
    command:
      - sh
      - -ec
      - >-
        umask 077;
        head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n' > /fixtures/admin-key;
        chown -R 1000:1000 /fixtures;
        chmod 700 /fixtures

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    restart: on-failure:5
    depends_on:
      postgres-zitadel: {condition: service_healthy}
      zitadel-fixtures-init: {condition: service_completed_successfully}
    command:
      - start-from-init
      - --config
      - /config/zitadel.config.yaml
      - --config
      - /config/zitadel.secrets.yaml
      - --steps
      - /config/zitadel.init-steps.yaml
      - --masterkey
      - Milestone03MasterKeyMustBe32Byte
      - --tlsMode
      - disabled
    volumes:
      - ./zitadel:/config:ro
      - fixtures:/fixtures
    healthcheck:
      test:
        - CMD
        - /app/zitadel
        - ready
        - --config
        - /config/zitadel.config.yaml
        - --config
        - /config/zitadel.secrets.yaml
      interval: 2s
      timeout: 5s
      retries: 60

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.2
    user: "0"
    depends_on:
      zitadel: {condition: service_healthy}
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /fixtures/zitadel-login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:identity.e2e.gizway.test,X-Forwarded-Proto:http
    volumes: [fixtures:/fixtures:ro]
    healthcheck:
      test: [CMD-SHELL, node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy]
      interval: 2s
      timeout: 5s
      retries: 60

  identity-proxy:
    image: nginx:1.29.1-alpine
    depends_on:
      zitadel: {condition: service_healthy}
      zitadel-login: {condition: service_healthy}
    volumes:
      - ./zitadel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases: [identity.e2e.gizway.test]
    healthcheck:
      test: [CMD-SHELL, wget --quiet --spider http://127.0.0.1:18080/debug/healthz]
      interval: 2s
      timeout: 5s
      retries: 60

  zitadel-bootstrap:
    <<: *app
    depends_on:
      identity-proxy: {condition: service_healthy}
    volumes: [fixtures:/fixtures]
    command:
      - e2e-bootstrap
      - --mode=zitadel
      - --zitadel-url=http://identity.e2e.gizway.test:18080
      - --output-directory=/fixtures

  fake-provider-cn:
    <<: *app
    command:
      - fake-ai-provider
      - --address=0.0.0.0:19000
      - --credential=cn-provider-secret,cn-provider-secret-replacement,cn-provider-secret-two,cn-provider-secret-three
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:19000/test/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  fake-provider-global:
    <<: *app
    command: [fake-ai-provider, --address=0.0.0.0:19000, --credential=global-provider-secret]
    ports: ["127.0.0.1::19000"]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:19000/test/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  gizpay-migrate:
    <<: *app
    depends_on:
      postgres-gizpay: {condition: service_healthy}
    volumes:
      - ./config/gizpay.yaml:/config/gizpay.yaml:ro
    command: [gizpay, --config=/config/gizpay.yaml, --migrate-only]

  gizway-cn-migrate:
    <<: *app
    depends_on:
      postgres-cn: {condition: service_healthy}
    volumes:
      - ./config/gizway-cn.yaml:/config/gizway-cn.yaml:ro
    command: [gizway, --config=/config/gizway-cn.yaml, --migrate-only]

  gizway-global-migrate:
    <<: *app
    depends_on:
      postgres-global: {condition: service_healthy}
    volumes:
      - ./config/gizway-global.yaml:/config/gizway-global.yaml:ro
    command: [gizway, --config=/config/gizway-global.yaml, --migrate-only]

  gizpay:
    <<: *app
    depends_on:
      gizpay-migrate: {condition: service_completed_successfully}
      zitadel-bootstrap: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
    volumes:
      - ./config/gizpay.yaml:/config/gizpay.yaml:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizpay, --config=/config/gizpay.yaml]
    ports: ["127.0.0.1::8081"]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8081/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  credit-spy:
    <<: *app
    depends_on:
      gizpay: {condition: service_healthy}
    command: [fake-credit-spy, --address=0.0.0.0:19400, --upstream=http://gizpay:8081]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0

  toxiproxy-init:
    image: curlimages/curl:8.15.0
    depends_on:
      credit-spy: {condition: service_started}
      toxiproxy: {condition: service_started}
    command:
      - sh
      - -ec
      - >-
        curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies
        -H 'Content-Type: application/json'
        -d '{"name":"gizpay","listen":"0.0.0.0:8666","upstream":"credit-spy:19400"}'

  oauth-spy:
    <<: *app
    depends_on:
      zitadel: {condition: service_started}
    command: [fake-oauth-spy, --address=0.0.0.0:19500, --upstream=http://identity.e2e.gizway.test:18080]

  gizway-cn:
    <<: *app
    depends_on:
      gizway-cn-migrate: {condition: service_completed_successfully}
      fake-provider-cn: {condition: service_healthy}
      toxiproxy-init: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
      zitadel-bootstrap: {condition: service_completed_successfully}
    volumes:
      - fixtures:/config:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizway, --config=/config/gizway-cn.yaml]
    ports: ["127.0.0.1::8080"]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8080/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  gizway-global:
    <<: *app
    depends_on:
      gizway-global-migrate: {condition: service_completed_successfully}
      fake-provider-global: {condition: service_healthy}
      toxiproxy-init: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
      zitadel-bootstrap: {condition: service_completed_successfully}
    volumes:
      - fixtures:/config:ro
      - ./secrets:/secrets:ro
      - fixtures:/fixtures:ro
    command: [gizway, --config=/config/gizway-global.yaml]
    ports: ["127.0.0.1::8080"]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:8080/healthz]
      interval: 1s
      timeout: 3s
      retries: 60

  bootstrap-milestone-03:
    <<: *app
    depends_on:
      gizpay: {condition: service_healthy}
      gizway-cn: {condition: service_healthy}
      gizway-global: {condition: service_healthy}
    volumes:
      - fixtures:/fixtures
      - ./secrets:/secrets:ro
      - ./config/business-seed.yaml:/config/business-seed.yaml:ro
    command:
      - e2e-bootstrap
      - --mode=milestone-03
      - --zitadel-url=http://identity.e2e.gizway.test:18080
      - --gizpay-url=http://gizpay:8081
      - --cn-url=http://gizway-cn:8080
      - --global-url=http://gizway-global:8080
      - --fixture-file=/fixtures/m03.vars
      - --identity-file=/fixtures/identity.vars
      - --seed-config=/config/business-seed.yaml
      - --hmac-secret-file=/secrets/subscription-key-hmac
      - --cn-provider-url=http://fake-provider-cn:19000
      - --global-provider-url=http://fake-provider-global:19000

  web:
    profiles: [web]
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.web
    depends_on:
      bootstrap-milestone-03: {condition: service_completed_successfully}
      powersync-gizpay: {condition: service_started}
      powersync-cn: {condition: service_started}
      powersync-global: {condition: service_started}
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 5s
      retries: 60

  hurl-api:
    image: ghcr.io/orange-opensource/hurl:7.0.0
    profiles: [milestone-03-api]
    volumes:
      - ../..:/workspace:ro
      - fixtures:/fixtures:ro
    command: [--version]

volumes:
  fixtures:
  postgres-zitadel:
  postgres-gizpay:
  postgres-cn:
  postgres-global:
  postgres-powersync:
