name: gizway-e2e

x-postgres: &postgres
  image: postgres:17.10-bookworm
  environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
  healthcheck:
    test: [CMD-SHELL, 'test "$$(cat /proc/1/comm)" = postgres && pg_isready -U postgres -d "$${POSTGRES_DB}"']
    interval: 1s
    timeout: 3s
    retries: 60
  command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]

x-postgres-tls: &postgres-tls
  <<: *postgres
  command:
    - sh
    - -ec
    - |
      install -m 0644 /run/postgres-tls-input/server.crt /var/lib/postgresql/server.crt
      install -m 0600 /run/postgres-tls-input/server.key /var/lib/postgresql/server.key
      chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
      exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10

x-test: &test
  image: gizway-e2e-helper:dev

x-entry-environment: &entry-environment
  GLOBAL_HOST: ${GLOBAL_HOST:-global.e2e.gizclaw.test}
  CN_HOST: ${CN_HOST:-cn.e2e.gizclaw.test}
  AUTH_HOST: ${AUTH_HOST:-identity.e2e.gizclaw.test}
  PAY_HOST: ${PAY_HOST:-pay.e2e.gizclaw.test}
  TLS_CERT_FILE: /run/secrets/tls.crt
  TLS_KEY_FILE: /run/secrets/tls.key
  GIZPAY_UPSTREAM: http://gizpay:8081
  ZITADEL_UPSTREAM: h2c://zitadel:8080
  ZITADEL_LOGIN_UPSTREAM: http://zitadel-login:3000
  POWERSYNC_PAY_UPSTREAM: http://powersync-pay:8080

x-entry-volumes: &entry-volumes
  - ${TLS_CERT_FILE:?set TLS_CERT_FILE to an external E2E certificate}:/run/secrets/tls.crt:ro
  - ${TLS_KEY_FILE:?set TLS_KEY_FILE to its external private key}:/run/secrets/tls.key:ro

services:
  postgres-zitadel:
    <<: *postgres
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: zitadel}
    volumes: [postgres-zitadel:/var/lib/postgresql/data]
  postgres-gizpay:
    <<: *postgres-tls
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: gizpay}
    volumes: [postgres-gizpay:/var/lib/postgresql/data, '${POSTGRES_TLS_CERT_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.crt:ro', '${POSTGRES_TLS_KEY_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.key:ro']
    ports: ["127.0.0.1::5432"]
  postgres-global:
    <<: *postgres-tls
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: gizway}
    volumes: [postgres-global:/var/lib/postgresql/data, '${POSTGRES_TLS_CERT_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.crt:ro', '${POSTGRES_TLS_KEY_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.key:ro']
    ports: ["127.0.0.1::5432"]
  postgres-cn:
    <<: *postgres-tls
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: gizway}
    volumes: [postgres-cn:/var/lib/postgresql/data, '${POSTGRES_TLS_CERT_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.crt:ro', '${POSTGRES_TLS_KEY_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.key:ro']
  postgres-powersync:
    <<: *postgres-tls
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
    volumes: [postgres-powersync:/var/lib/postgresql/data, '${POSTGRES_TLS_CERT_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.crt:ro', '${POSTGRES_TLS_KEY_FILE:?set by tests/e2e/run.sh}:/run/postgres-tls-input/server.key:ro']

  fixtures-init:
    image: busybox:1.37.0
    user: "0:0"
    volumes: [fixtures:/fixtures, zitadel-masterkey:/run/secrets]
    command: [sh, -ec, "chmod 0777 /fixtures; printf '%s' 'e2e-admin-key' > /fixtures/admin-key; chmod 0644 /fixtures/admin-key; printf '%s' 'e2e-zitadel-master-key-000000000' > /run/secrets/zitadel-masterkey; chown 1000:1000 /run/secrets/zitadel-masterkey; chmod 0400 /run/secrets/zitadel-masterkey"]

  gizpay-init:
    image: gizway-e2e-gizpay:dev
    build: {context: ../.., dockerfile: docker/gizpay/Dockerfile}
    depends_on:
      postgres-gizpay: {condition: service_healthy}
      postgres-powersync: {condition: service_healthy}
    volumes: [./config/gizpay-init.yaml:/config/init.yaml:ro]
    command: [init, --config=/config/init.yaml]
  gizway-global-init:
    image: gizway-e2e-gizway:dev
    build: {context: ../.., dockerfile: docker/gizway/Dockerfile}
    depends_on:
      postgres-global: {condition: service_healthy}
      postgres-powersync: {condition: service_healthy}
    volumes: [./config/gizway-global-init.yaml:/config/init.yaml:ro]
    command: [init, --config=/config/init.yaml]
  gizway-cn-init:
    image: gizway-e2e-gizway:dev
    depends_on:
      postgres-cn: {condition: service_healthy}
      postgres-powersync: {condition: service_healthy}
    volumes: [./config/gizway-cn-init.yaml:/config/init.yaml:ro]
    command: [init, --config=/config/init.yaml]

  zitadel:
    image: gizway-e2e-zitadel:dev
    build: {context: ../.., dockerfile: docker/gizway-zitadel/Dockerfile}
    restart: on-failure:5
    depends_on:
      postgres-zitadel: {condition: service_healthy}
      fixtures-init: {condition: service_completed_successfully}
    environment:
      ZITADEL_EXTERNALDOMAIN: identity.e2e.gizclaw.test
      ZITADEL_EXTERNALPORT: "18080"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /fixtures/zitadel-bootstrap-machine.json
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /fixtures/zitadel-login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_NAME: GizWay E2E Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Bootstrap1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap-machine
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: GizWay E2E Bootstrap Machine
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: GizWay E2E Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2036-01-01T00:00:00Z"
      # E2E Action targets are Compose services. Keep loopback, metadata, 10/8,
      # benchmark and IPv6 ranges denied while allowing Docker's 172/12 or
      # 192.168/16 project network to receive the disposable webhook.
      ZITADEL_HTTPCLIENT_DENYLIST: localhost,0.0.0.0/8,10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,198.18.0.0/15,::/128,::1/128,fc00::/7,fe80::/10
    command: [start-from-init, --config, /etc/gizway/zitadel.yaml, --masterkeyFile, /run/secrets/zitadel-masterkey, --tlsMode, external]
    volumes: [fixtures:/fixtures, zitadel-masterkey:/run/secrets:ro]
    healthcheck:
      test: [CMD, /app/zitadel, ready, --config, /etc/gizway/zitadel.yaml]
      interval: 2s
      timeout: 5s
      retries: 90

  zitadel-login:
    image: gizway-e2e-zitadel-login:dev
    build: {context: ../.., dockerfile: docker/gizway-zitadel-login/Dockerfile}
    depends_on: {zitadel: {condition: service_healthy}}
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /fixtures/zitadel-login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:identity.e2e.gizclaw.test,X-Forwarded-Proto:http
    volumes: [fixtures:/fixtures:ro]
    healthcheck:
      test: [CMD-SHELL, node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy]
      interval: 2s
      timeout: 5s
      retries: 60

  entry-central:
    image: gizway-e2e-entry:dev
    build: {context: ../.., dockerfile: docker/gizway-entry/Dockerfile}
    depends_on:
      zitadel: {condition: service_healthy}
      zitadel-login: {condition: service_healthy}
    environment:
      <<: *entry-environment
      PROFILE: central
    volumes: *entry-volumes
    networks: {default: {aliases: [identity.e2e.gizclaw.test, pay.e2e.gizclaw.test]}}
    ports: ["127.0.0.1:18080:18080"]
    healthcheck: {test: [CMD, traefik, healthcheck, --ping], interval: 2s, timeout: 5s, retries: 60}

  identity-resources:
    <<: *test
    build: {context: ../.., dockerfile: tests/e2e/Dockerfile}
    depends_on: {entry-central: {condition: service_healthy}}
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: [fixtures:/fixtures, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [e2e-resources, --mode=zitadel, --zitadel-url=https://identity.e2e.gizclaw.test:18080, --output-directory=/fixtures, '--global-entry-port=${GIZWAY_E2E_GLOBAL_PORT:-3000}', '--cn-entry-port=${GIZWAY_E2E_CN_PORT:-3001}']

  identity-fixtures-ready:
    image: busybox:1.37.0
    user: "0:0"
    depends_on: {identity-resources: {condition: service_completed_successfully}}
    volumes: [fixtures:/fixtures]
    command: [sh, -ec, "chmod -R a+rX /fixtures"]

  oauth-spy:
    <<: *test
    depends_on: {entry-central: {condition: service_started}}
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: ['${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [fake-oauth-spy, --address=0.0.0.0:19500, --upstream=https://identity.e2e.gizclaw.test:18080]
  fake-provider-global:
    <<: *test
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: ['${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [fake-ai-provider, --address=0.0.0.0:19000, --credential=global-provider-secret]
    ports: ["127.0.0.1::19000"]
  fake-provider-cn:
    <<: *test
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: ['${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [fake-ai-provider, --address=0.0.0.0:19000, --credential=cn-provider-secret,cn-provider-secret-replacement,cn-provider-secret-two,cn-provider-secret-three]

  gizpay:
    image: gizway-e2e-gizpay:dev
    depends_on:
      gizpay-init: {condition: service_completed_successfully}
      identity-fixtures-ready: {condition: service_completed_successfully}
      oauth-spy: {condition: service_started}
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: [./config/gizpay.yaml:/config/gizpay.yaml:ro, ./secrets:/secrets:ro, fixtures:/fixtures:ro, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [serve, --config=/config/gizpay.yaml]
    ports: ["127.0.0.1::8081"]
  credit-spy:
    <<: *test
    depends_on: {gizpay: {condition: service_started}}
    command: [fake-credit-spy, --address=0.0.0.0:19400, --upstream=http://gizpay:8081]
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
  toxiproxy-init:
    image: curlimages/curl:8.15.0
    depends_on: {credit-spy: {condition: service_started}, toxiproxy: {condition: service_started}}
    command: [sh, -ec, "curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json' -d '{\"name\":\"gizpay\",\"listen\":\"0.0.0.0:8666\",\"upstream\":\"credit-spy:19400\"}'"]
  gizway-global:
    image: gizway-e2e-gizway:dev
    depends_on:
      gizway-global-init: {condition: service_completed_successfully}
      identity-fixtures-ready: {condition: service_completed_successfully}
      fake-provider-global: {condition: service_started}
      oauth-spy: {condition: service_started}
      toxiproxy-init: {condition: service_completed_successfully}
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: [fixtures:/config:ro, ./secrets:/secrets:ro, fixtures:/fixtures:ro, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [serve, --config=/config/gizway-global.yaml]
    ports: ["127.0.0.1::8080"]
  gizway-cn:
    image: gizway-e2e-gizway:dev
    depends_on:
      gizway-cn-init: {condition: service_completed_successfully}
      identity-fixtures-ready: {condition: service_completed_successfully}
      fake-provider-cn: {condition: service_started}
      oauth-spy: {condition: service_started}
      toxiproxy-init: {condition: service_completed_successfully}
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: [fixtures:/config:ro, ./secrets:/secrets:ro, fixtures:/fixtures:ro, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [serve, --config=/config/gizway-cn.yaml]
    ports: ["127.0.0.1::8080"]

  business-resources:
    <<: *test
    depends_on:
      gizpay: {condition: service_started}
      gizway-global: {condition: service_started}
      gizway-cn: {condition: service_started}
    environment: {SSL_CERT_FILE: /tls/tls.crt}
    volumes: [fixtures:/fixtures, ./secrets:/secrets:ro, ./config/resources.yaml:/config/resources.yaml:ro, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [e2e-resources, --mode=milestone-03, --zitadel-url=https://identity.e2e.gizclaw.test:18080, --gizpay-url=http://gizpay:8081, --cn-url=http://gizway-cn:8080, --global-url=http://gizway-global:8080, --fixture-file=/fixtures/m03.vars, --identity-file=/fixtures/identity.vars, --resource-config=/config/resources.yaml, --hmac-secret-file=/secrets/subscription-key-hmac, --cn-provider-url=http://fake-provider-cn:19000, --global-provider-url=http://fake-provider-global:19000]

  powersync-pay:
    image: gizway-e2e-powersync:dev
    build: {context: ../.., dockerfile: docker/gizway-powersync/Dockerfile}
    depends_on: {business-resources: {condition: service_completed_successfully}}
    environment:
      POWERSYNC_CONFIG_PATH: /etc/gizway/powersync/pay/service.yaml
      PS_SOURCE_URI: postgres://powersync_pay_source:powersync_pay_source@postgres-gizpay:5432/gizpay
      PS_SOURCE_SSL_MODE: verify-full
      PS_SOURCE_CA_FILE: /run/secrets/postgres-ca.crt
      PS_STORAGE_URI: postgres://powersync_pay_storage:powersync_pay_storage@postgres-powersync:5432/gizpay_sync
      PS_STORAGE_SSL_MODE: verify-full
      PS_STORAGE_CA_FILE: /run/secrets/postgres-ca.crt
      PS_JWKS_URI: http://oauth-spy:19500/oauth/v2/keys
      PS_AUDIENCE: "386000000000000001"
    volumes: ['${POSTGRES_TLS_CERT_FILE:?set by tests/e2e/run.sh}:/run/secrets/postgres-ca.crt:ro']
    ports: ["127.0.0.1::8080"]
  powersync-global:
    image: gizway-e2e-powersync:dev
    depends_on: {business-resources: {condition: service_completed_successfully}}
    environment:
      POWERSYNC_CONFIG_PATH: /etc/gizway/powersync/global/service.yaml
      PS_SOURCE_URI: postgres://powersync_global_source:powersync_global_source@postgres-global:5432/gizway
      PS_SOURCE_SSL_MODE: verify-full
      PS_SOURCE_CA_FILE: /run/secrets/postgres-ca.crt
      PS_STORAGE_URI: postgres://powersync_global_storage:powersync_global_storage@postgres-powersync:5432/global_sync
      PS_STORAGE_SSL_MODE: verify-full
      PS_STORAGE_CA_FILE: /run/secrets/postgres-ca.crt
      PS_JWKS_URI: http://oauth-spy:19500/oauth/v2/keys
      PS_AUDIENCE: "386000000000000001"
    volumes: ['${POSTGRES_TLS_CERT_FILE:?set by tests/e2e/run.sh}:/run/secrets/postgres-ca.crt:ro']
    ports: ["127.0.0.1::8080"]
  powersync-cn:
    image: gizway-e2e-powersync:dev
    depends_on: {business-resources: {condition: service_completed_successfully}}
    environment:
      POWERSYNC_CONFIG_PATH: /etc/gizway/powersync/cn/service.yaml
      PS_SOURCE_URI: postgres://powersync_cn_source:powersync_cn_source@postgres-cn:5432/gizway
      PS_SOURCE_SSL_MODE: verify-full
      PS_SOURCE_CA_FILE: /run/secrets/postgres-ca.crt
      PS_STORAGE_URI: postgres://powersync_cn_storage:powersync_cn_storage@postgres-powersync:5432/cn_sync
      PS_STORAGE_SSL_MODE: verify-full
      PS_STORAGE_CA_FILE: /run/secrets/postgres-ca.crt
      PS_JWKS_URI: http://oauth-spy:19500/oauth/v2/keys
      PS_AUDIENCE: "386000000000000001"
    volumes: ['${POSTGRES_TLS_CERT_FILE:?set by tests/e2e/run.sh}:/run/secrets/postgres-ca.crt:ro']
    ports: ["127.0.0.1::8080"]

  entry-global:
    image: gizway-e2e-entry:dev
    depends_on: {powersync-global: {condition: service_started}, powersync-pay: {condition: service_started}}
    environment:
      <<: *entry-environment
      PROFILE: global
      GIZWAY_UPSTREAM: http://gizway-global:8080
      POWERSYNC_GIZWAY_UPSTREAM: http://powersync-global:8080
    volumes: *entry-volumes
    networks: {default: {aliases: [global.e2e.gizclaw.test]}}
    ports: ["127.0.0.1:${GIZWAY_E2E_GLOBAL_PORT:-3000}:8443"]
    healthcheck: {test: [CMD, traefik, healthcheck, --ping], interval: 2s, timeout: 5s, retries: 60}
  entry-cn:
    image: gizway-e2e-entry:dev
    depends_on: {powersync-cn: {condition: service_started}, powersync-pay: {condition: service_started}}
    environment:
      <<: *entry-environment
      PROFILE: cn
      GIZWAY_UPSTREAM: http://gizway-cn:8080
      POWERSYNC_GIZWAY_UPSTREAM: http://powersync-cn:8080
    volumes: *entry-volumes
    networks: {default: {aliases: [cn.e2e.gizclaw.test]}}
    ports: ["127.0.0.1:${GIZWAY_E2E_CN_PORT:-3001}:8443"]
    healthcheck: {test: [CMD, traefik, healthcheck, --ping], interval: 2s, timeout: 5s, retries: 60}

  hurl-api:
    image: ghcr.io/orange-opensource/hurl:8.0.1
    profiles: [test]
    depends_on: {entry-global: {condition: service_healthy}, entry-cn: {condition: service_healthy}}
    volumes: [../..:/workspace:ro, fixtures:/fixtures:ro, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [--version]

  sdk-test:
    image: golang:1.26.6-bookworm
    profiles: [test]
    working_dir: /workspace/tests/sdk
    depends_on: {entry-global: {condition: service_healthy}, entry-cn: {condition: service_healthy}}
    environment: {SSL_CERT_FILE: /tls/tls.crt, GOTOOLCHAIN: local}
    volumes: [../..:/workspace:ro, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [go, test, -count=1, ./...]

  powersync-test:
    image: node:22.22.1-bookworm
    profiles: [test]
    working_dir: /workspace/tests/powersync
    depends_on: {entry-global: {condition: service_healthy}, entry-cn: {condition: service_healthy}}
    environment: {NODE_EXTRA_CA_CERTS: /tls/tls.crt}
    volumes: [../..:/workspace:ro, '${TLS_CERT_FILE:?set TLS_CERT_FILE}:/tls/tls.crt:ro']
    command: [sh, -ec, 'mkdir -p /tmp/workspace/tests /tmp/workspace/docker && cp -R /workspace/tests/powersync /tmp/workspace/tests/ && cp -R /workspace/docker/gizway-powersync /tmp/workspace/docker/ && cp -R /workspace/data /tmp/workspace/ && cd /tmp/workspace/tests/powersync && npm ci && npm run typecheck && npm test']

volumes:
  fixtures:
  zitadel-masterkey:
  postgres-zitadel:
  postgres-gizpay:
  postgres-global:
  postgres-cn:
  postgres-powersync:
