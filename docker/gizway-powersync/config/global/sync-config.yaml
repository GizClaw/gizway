config:
  edition: 3

streams:
  regional_catalog:
    auto_subscribe: true
    queries:
      - SELECT * FROM client_sync.models AS models WHERE status = 'active' AND (auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog' IS NULL OR auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog_global' IS NOT NULL)
      - SELECT * FROM client_sync.providers AS providers WHERE status = 'active' AND (auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog' IS NULL OR auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog_global' IS NOT NULL)
      - SELECT * FROM gizway.model_customer_prices WHERE auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog' IS NULL OR auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog_global' IS NOT NULL
      - SELECT * FROM gizway.model_listings WHERE availability = 'available' AND (auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog' IS NULL OR auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog_global' IS NOT NULL)

  current_user:
    auto_subscribe: true
    queries:
      - |
        SELECT id, provider_id, key, merchant_id, name, last_used_at,
               earned_microcredits, status, prices_json, created_at, updated_at
        FROM client_sync.provider_keys AS "my_provider_keys"
        WHERE owner_identity_subject = auth.user_id()
          AND owner_identity_issuer = auth.parameter('iss')
          AND auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog' IS NULL
      - |
        SELECT id, external_order_id, account_id, subscription_id, subscription_key_id, product_id,
               model_id, provider_id, gross_microcredits, status, created_at,
               completed_at
        FROM gizway.ai_orders AS "my_ai_orders"
        WHERE owner_identity_subject = auth.user_id()
          AND owner_identity_issuer = auth.parameter('iss')
          AND auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog' IS NULL
      - |
        SELECT id, account_id, order_id, model_id, metric, quantity,
               status, created_at
        FROM client_sync.ai_usage AS "my_ai_usage"
        WHERE owner_identity_subject = auth.user_id()
          AND owner_identity_issuer = auth.parameter('iss')
          AND auth.parameter('urn:zitadel:iam:org:project:386000000000000001:roles') ->> 'public_catalog' IS NULL
