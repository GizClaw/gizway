        fingerprint_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        serial_number: {type: string, minLength: 1, maxLength: 255}
        subject_dn: {type: string, minLength: 1, maxLength: 1000}
        san_uri: {type: string, format: uri, minLength: 1, maxLength: 1000}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
    GatewayNodeCertificate:
      type: object
      additionalProperties: false
      required: [id, node_id, fingerprint_sha256, serial_number, subject_dn, san_uri, status, not_before, not_after, created_at]
      properties:
        id: {type: string}
        node_id: {type: string}
        fingerprint_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        serial_number: {type: string}
        subject_dn: {type: string}
        san_uri: {type: string, format: uri}
        status: {type: string, enum: [pending, active, revoked, expired]}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
    GatewayNode:
      type: object
      additionalProperties: false
      required: [id, region, name, created_at, updated_at, certificates]
      properties:
        id: {type: string}
        region: {type: string, enum: [cn, global]}
        name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
