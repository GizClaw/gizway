openapi: 3.1.0
info:
  title: Gizway Common Schemas
  version: 1.0.0
  description: Shared schemas used by Gizway-owned APIs.
paths: {}
components:
  securitySchemes:
    userSessionAuth:
      type: http
      scheme: bearer
      bearerFormat: Gizway user session
    gatewayApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Gizway Gateway API key
    paymentApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Gizway Payment API key
    adminSessionAuth:
      type: http
      scheme: bearer
      bearerFormat: Gizway administrator session
    adminApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Gizway Admin API key
    realtimeClientSecretAuth:
      type: http
      scheme: bearer
      bearerFormat: Gizway Realtime client secret
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A caller-generated key used to make a command safe to retry.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    CreditAmount:
      type: object
      additionalProperties: false
      required: [asset, microcredits]
      properties:
        asset:
          type: string
          const: GIZ_CREDIT
        microcredits:
          type: integer
          format: int64
          minimum: 0
          description: Integer amount where one Credit equals 1,000,000 microcredits.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential does not have the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The command conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: A required external integration is not configured or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
